name: Release

# Push a tag like v0.1.0 to build, sign (SignPath Foundation) and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release --locked

      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: tachyon-unsigned
          path: target/release/tachyon.exe
          if-no-files-found: error

      # Runs only once the SignPath secrets exist (after the project is approved).
      - name: Sign with SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tachyon
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = if (Test-Path signed/tachyon.exe) { "signed/tachyon.exe" } else { "target/release/tachyon.exe" }
          Copy-Item $exe dist/tachyon.exe
          Get-AuthenticodeSignature dist/tachyon.exe | Format-List Status, SignerCertificate
          (Get-FileHash dist/tachyon.exe -Algorithm SHA256).Hash + "  tachyon.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tachyon.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Download `tachyon.exe` and run it. No installer is needed.

            **Code signing policy:** free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/jonahhawk/tachyon#code-signing-policy).
